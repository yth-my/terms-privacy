name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      # Method 1: Deploy using FIREBASE_TOKEN (from `firebase login:ci`)
      - name: Deploy using FIREBASE_TOKEN
        if: "${{ secrets.FIREBASE_TOKEN != '' }}"
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PROJECT_ID: terms-privacy-generator

      # Method 2: Deploy using Service Account (from `firebase init hosting:github`)
      - name: Deploy using Firebase Service Account
        if: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_TERMS_PRIVACY_GENERATOR != '' || secrets.FIREBASE_SERVICE_ACCOUNT != '' }}"
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TERMS_PRIVACY_GENERATOR || secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: terms-privacy-generator
